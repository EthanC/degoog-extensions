<div class="prospero-card" data-prospero-card data-prospero-id="{{id}}">
  {{background}}
  <div class="prospero-head">
    {{icon}}
    <div class="prospero-main">
      <div class="prospero-kicker">{{platform}}<span class="prospero-id degoog-badge">{{id}}</span></div>
      <a class="prospero-name" href="{{url}}" data-prospero-link>{{name}}</a>
      {{details}}
      <a class="prospero-more" href="{{url}}" data-prospero-more>{{link}} <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>
    </div>
  </div>
</div>
