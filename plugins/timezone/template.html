<div class="tz-card" data-tz-card data-tz-mode="{{mode}}" data-tz-at="{{at}}" data-tz-locale="{{locale}}" data-tz-clock="{{clock}}" data-tz-seconds="{{seconds}}" data-tz-browser="{{browser}}"{{rootAttrs}}>
  <div class="tz-head">
    <div class="tz-kicker">{{kicker}}{{badge}}</div>
    <div class="tz-headline">{{headline}}</div>
    <div class="tz-sub">{{sub}}</div>
  </div>
  <dl class="tz-rows">{{rows}}</dl>
  {{notes}}
</div>
