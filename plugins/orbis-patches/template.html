<div class="orbis-card" data-orbis-card data-orbis-id="{{id}}">
  {{background}}
  <div class="orbis-head">
    {{icon}}
    <div class="orbis-main">
      <div class="orbis-kicker">{{platform}}<span class="orbis-id degoog-badge">{{id}}</span></div>
      <a class="orbis-name" href="{{url}}" data-orbis-link>{{name}}</a>
      {{details}}
      <a class="orbis-more" href="{{url}}" data-orbis-more>{{link}} <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>
    </div>
  </div>
</div>
