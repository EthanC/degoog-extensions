<div class="tstamp-card" data-tstamp-card data-tstamp-mode="{{mode}}" data-tstamp-ms="{{ms}}" data-tstamp-live="{{live}}" data-tstamp-clock="{{clock}}">
  <div class="tstamp-head">
    <div class="tstamp-kicker">{{kicker}}{{badge}}</div>
    <div class="tstamp-headline{{headMono}}" data-tstamp-field="{{headField}}" data-tstamp-zone="UTC">{{headline}}</div>
    <div class="tstamp-sub" data-tstamp-sub>{{subline}}</div>
  </div>
  <dl class="tstamp-rows">{{rows}}</dl>
  {{note}}
</div>
