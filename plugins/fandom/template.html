<div class="fandom-card" data-fandom-card data-fandom-wiki="{{wiki}}">
  <div class="fandom-overview">
    {{image}}
    <a class="fandom-title" href="{{url}}" target="_blank" rel="noopener noreferrer" data-fandom-link>{{title}}</a>
    {{summary}}
  </div>
  {{facts}}
  <a class="fandom-source" href="{{url}}" target="_blank" rel="noopener noreferrer" data-fandom-more>{{favicon}}<span>{{more}}</span> <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>
</div>
